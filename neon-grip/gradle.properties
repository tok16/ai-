# Настройки сборки Neon Grip
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true

# AndroidX обязателен для SurfaceView/Immersive/WindowInsets кода
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Kotlin-компилятор внутри процесса Gradle (экономия RAM в CI-песочнице)
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.enabled=false
